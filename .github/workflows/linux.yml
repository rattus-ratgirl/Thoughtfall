name: Build and test Linux packages
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check packaging scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck scripts/*Linux*.sh packaging/linux/thoughtfall
      - run: dotnet build Thoughtfall.slnx -c Release -warnaserror
      - run: dotnet test Thoughtfall.Tests -c Release --no-build --results-directory artifacts/test-results
      - name: Build Debian package
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/Build-Linux.sh "$VERSION" "$ARCH"
      - name: Check package on Ubuntu and Debian
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/Test-LinuxPackages.sh "$VERSION" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux-${{ matrix.arch }}
          path: artifacts/installers/${{ inputs.version }}/*.deb
          if-no-files-found: error
