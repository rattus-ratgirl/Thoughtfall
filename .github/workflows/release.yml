name: Release Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (major.minor.patch)'
        required: true
        default: '0.1.0'
        type: string
permissions:
  contents: read
concurrency:
  group: release-windows
  cancel-in-progress: false
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/Release-Version.ps1 -Version $env:VERSION
          $tag = "v$env:VERSION"
          $tags = gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing tags.' }
          if ($tags | Where-Object ref -eq "refs/tags/$tag") { throw "Tag $tag already exists. Do not replace public releases." }
          $pages = gh api --paginate --slurp "repos/$env:GH_REPO/releases" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing releases.' }
          $releases = @($pages | ForEach-Object { $_ })
          if ($releases | Where-Object tag_name -eq $tag) { throw "Release $tag already exists, including drafts." }
          $latest = @($releases | Where-Object { !$_.draft -and !$_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.tag_name.Substring(1) } | Sort-Object -Descending)
          if ($latest.Count -and [version]$env:VERSION -le $latest[0]) { throw 'Stable versions must increase.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Thoughtfall.slnx -c Release -warnaserror
      - run: dotnet test Thoughtfall.Tests -c Release --no-build --results-directory artifacts/test-results
      - run: ./scripts/Test-ReleaseScripts.ps1
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $compiler = ./scripts/Get-ReleaseTool.ps1 -Tool InnoSetup
          ./scripts/Build-Windows.ps1 -Version $env:VERSION -IsccPath $compiler
          ./scripts/Test-WindowsInstaller.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: installer
        with:
          name: unsigned-installer
          path: artifacts/installers/${{ inputs.version }}/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-installer
          path: release
      - name: Verify and publish
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/Publish-Release.ps1

  winget:
    needs: publish
    if: vars.WINGET_ENABLED == 'true'
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
