name: Release Windows
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump from the latest Changie version'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: release-windows
  cancel-in-progress: false
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:BUMP -cnotin @('patch', 'minor', 'major')) {
              throw 'Unsupported version bump.'
          }

          $changie = ./scripts/Get-ReleaseTool.ps1 -Tool Changie
          $version = & $changie next $env:BUMP

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot calculate the next Changie version.'
          }

          ./scripts/Release-Version.ps1 -Version $version

          $tag = "v$version"
          $tags = gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag" | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot check existing tags.'
          }

          if ($tags | Where-Object ref -eq "refs/tags/$tag") {
              throw "Tag $tag already exists. Do not replace public releases."
          }

          $pages = gh api --paginate --slurp "repos/$env:GH_REPO/releases" | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot check existing releases.'
          }

          $releases = @($pages | ForEach-Object { $_ })

          if ($releases | Where-Object tag_name -eq $tag) {
              throw "Release $tag already exists, including drafts."
          }

          $latest = @(
              $releases |
                  Where-Object { !$_.draft -and !$_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } |
                  ForEach-Object { [version]$_.tag_name.Substring(1) } |
                  Sort-Object -Descending
          )

          if ($latest.Count -and [version]$version -le $latest[0]) {
              throw 'Stable versions must increase.'
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Thoughtfall.slnx -c Release -warnaserror
      - run: dotnet test Thoughtfall.Tests -c Release --no-build --results-directory artifacts/test-results
      - run: ./scripts/Test-ReleaseScripts.ps1
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $compiler = ./scripts/Get-ReleaseTool.ps1 -Tool InnoSetup
          ./scripts/Build-Windows.ps1 -Version $env:VERSION -IsccPath $compiler
          ./scripts/Test-WindowsInstaller.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: installer
        with:
          name: unsigned-installer
          path: artifacts/installers/${{ steps.metadata.outputs.version }}/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # This job commits only the changelog after all build-job checks have passed.
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-installer
          path: release
      - name: Collect and commit release changelog
        id: changelog
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch origin $env:RELEASE_BRANCH

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot check the release branch.'
          }

          $branchSha = git rev-parse FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot read the release branch commit.'
          }

          if ($branchSha -cne $env:SOURCE_SHA) {
              throw 'The release branch changed during testing. Run a new release workflow.'
          }

          $changie = ./scripts/Get-ReleaseTool.ps1 -Tool Changie

          & $changie batch $env:VERSION --allow-no-changes=false

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot collect release fragments.'
          }

          & $changie merge

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot update CHANGELOG.md.'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- CHANGELOG.md .changes

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot stage the release changelog.'
          }

          git commit -m "🔖 release: prepare v$env:VERSION"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot commit the release changelog.'
          }

          git push origin "HEAD:refs/heads/$env:RELEASE_BRANCH"

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot push the changelog commit. Check branch rules and whether the branch advanced.'
          }

          $releaseSha = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
              throw 'Cannot read the release commit.'
          }

          "sha=$releaseSha" >> $env:GITHUB_OUTPUT
      - name: Verify and publish
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ steps.changelog.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/Publish-Release.ps1

  winget:
    needs: [build, publish]
    if: vars.WINGET_ENABLED == 'true'
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
