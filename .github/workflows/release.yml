name: Release Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (major.minor.patch)'
        required: true
        default: '0.1.0'
        type: string
      channel:
        description: 'Preview is unsigned and is never submitted to winget'
        required: true
        default: unsigned-preview
        type: choice
        options: [unsigned-preview, signed-stable]
permissions:
  contents: read
concurrency:
  group: release-windows
  cancel-in-progress: false
env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      artifact-id: ${{ steps.installer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ./scripts/Release-Version.ps1 -Version $env:VERSION
          $tag = "v$env:VERSION"
          if ($env:CHANNEL -eq 'unsigned-preview') { $tag += '-preview' }
          $tags = gh api "repos/$env:GH_REPO/git/matching-refs/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing tags.' }
          if ($tags | Where-Object ref -eq "refs/tags/$tag") { throw "Tag $tag already exists. Do not replace public releases." }
          $pages = gh api --paginate --slurp "repos/$env:GH_REPO/releases" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing releases.' }
          $releases = @($pages | ForEach-Object { $_ })
          if ($releases | Where-Object tag_name -eq $tag) { throw "Release $tag already exists, including drafts." }
          if ($env:CHANNEL -eq 'signed-stable') {
            $latest = @($releases | Where-Object { !$_.draft -and !$_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_.tag_name.Substring(1) } | Sort-Object -Descending)
            if ($latest.Count -and [version]$env:VERSION -le $latest[0]) { throw 'Stable versions must increase.' }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Thoughtfall.slnx -c Release -warnaserror
      - run: dotnet test Thoughtfall.Tests -c Release --no-build --results-directory artifacts/test-results
      - run: ./scripts/Test-ReleaseScripts.ps1
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $compiler = ./scripts/Get-ReleaseTool.ps1 -Tool InnoSetup
          ./scripts/Build-Windows.ps1 -Version $env:VERSION -IsccPath $compiler
          ./scripts/Test-WindowsInstaller.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: installer
        with:
          name: unsigned-installer
          path: artifacts/installers/${{ inputs.version }}/*.exe
          if-no-files-found: error

  sign:
    if: inputs.channel == 'signed-stable'
    needs: build
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check SignPath configuration
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          CONFIGURATION: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          foreach ($name in 'TOKEN', 'ORGANIZATION', 'PROJECT', 'POLICY', 'CONFIGURATION') {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing SignPath setting: $name" }
          }
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(inputs.version) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-installer
          path: signed/*.exe
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.sign.result == 'success' ||
       (inputs.channel == 'unsigned-preview' && needs.sign.result == 'skipped'))
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.channel == 'signed-stable' && 'signed-installer' || 'unsigned-installer' }}
          path: release
      - name: Verify and publish
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/Publish-Release.ps1

  winget:
    needs: publish
    if: inputs.channel == 'signed-stable' && vars.WINGET_ENABLED == 'true'
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
